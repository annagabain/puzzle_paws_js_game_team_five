<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paws Memory Game</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body class="app">
    <header class="game-header">
      <div class="container">
        <div class="game-brand">
          <img src="assets/logo.svg" alt="Paw logo" />
        </div>

        <div class="player-info">Hello, <span id="player-name">Anna</span></div>

        <div class="game-stats">
          <div class="stat-box">
            <div>Moves</div>
            <p id="moves">20</p>
          </div>

          <div class="timer stat-box">
            <div>Time</div>
            <p id="time">0:00</p>
          </div>
        </div>
      </div>
    </header>
    <main class="game-container">
      <section class="game-board" aria-label="Memory card game" id="board">
        <button class="card flipped" aria-label="Card 1">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card" type="button" aria-label="Card 2">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/fox.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card" type="button" aria-label="Card 3">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/leo.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card" type="button" aria-label="Card 4">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>

        <button class="card" type="button" aria-label="Card 5">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card hidden" type="button" aria-label="Card 6">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card" type="button" aria-label="Card 7">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card" type="button" aria-label="Card 8">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>

        <button class="card correct" type="button" aria-label="Card 9">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card correct" type="button" aria-label="Card 10">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card" type="button" aria-label="Card 11">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card" type="button" aria-label="Card 12">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>

        <button class="card flipped" type="button" aria-label="Card 13">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card flipped" type="button" aria-label="Card 14">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card flipped" type="button" aria-label="Card 15">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
        <button class="card flipped" type="button" aria-label="Card 16">
          <div class="card-inner">
            <div class="card-front">
              <img src="assets/animals/bear.svg" />
            </div>
            <div class="card-back"></div>
          </div>
        </button>
      </section>

      <div class="game-controls">
        <button id="restart-button" type="button" class="btn">Restart</button>
      </div>
    </main>
  </body>
</html>
