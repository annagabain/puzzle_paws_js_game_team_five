<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paws Memory Game</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body class="app">
    <header class="game-header">
      <div class="container">
        <div class="game-brand">
          <img src="assets/logo.svg" alt="Paw logo" />
        </div>

        <div class="player-info">Hello, <span id="player-name">Anna</span></div>

        <div class="game-stats">
          <div class="stat-box">
            <div>Moves</div>
            <p id="moves">20</p>
          </div>

          <div class="timer stat-box">
            <div>Time</div>
            <p id="time">0:00</p>
          </div>
        </div>
      </div>
    </header>

    <main class="game-container">
      <section class="game-board" aria-label="Memory card game">
        <button class="card" type="button" aria-label="Card 1"></button>
        <button class="card" type="button" aria-label="Card 2"></button>
        <button class="card" type="button" aria-label="Card 3"></button>
        <button class="card" type="button" aria-label="Card 4"></button>

        <button class="card" type="button" aria-label="Card 5"></button>
        <button class="card" type="button" aria-label="Card 6"></button>
        <button class="card" type="button" aria-label="Card 7"></button>
        <button class="card" type="button" aria-label="Card 8"></button>

        <button class="card" type="button" aria-label="Card 9"></button>
        <button class="card" type="button" aria-label="Card 10"></button>
        <button class="card" type="button" aria-label="Card 11"></button>
        <button class="card" type="button" aria-label="Card 12"></button>

        <button class="card" type="button" aria-label="Card 13"></button>
        <button class="card" type="button" aria-label="Card 14"></button>
        <button class="card" type="button" aria-label="Card 15"></button>
        <button class="card" type="button" aria-label="Card 16"></button>
      </section>

      <div class="game-controls">
        <button id="restart-button" type="button">Restart</button>
      </div>
    </main>
  </body>
</html>
